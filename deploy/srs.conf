listen 1935;
max_connections 100;
daemon off;
srs_log_tank console;
srs_log_level warn;
http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}
vhost __defaultVhost__ {
    http_hooks {
        enabled on;
        on_publish http://host.docker.internal:8080/api/live-media/publish;
    }
    hls {
        enabled on;
        hls_fragment 2;
        hls_window 12;
        hls_path ./objs/nginx/html;
        hls_m3u8_file [app]/[stream].m3u8;
        hls_ts_file [app]/[stream]-[seq].ts;
        hls_cleanup on;
        hls_dispose 30;
        hls_ctx off;
    }
}
